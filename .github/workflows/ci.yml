name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-lint-and-tests:
    name: Backend Pytest & Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run full backend test suite (unit, integration, contracts, e2e)
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRET: ci_secret_key_minimum_32_characters_for_jwt_testing
          APP_ENV: testing
          TIMEZONE: America/Argentina/Buenos_Aires
        run: |
          pytest backend/tests -v

  frontend-check-and-build:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest unit & component test suite
        run: npm test -- --run

      - name: Strict TypeScript typecheck
        run: npx tsc --noEmit

      - name: Compile production Vite bundle
        run: npm run build

  docker-validation:
    name: Docker & Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate development compose configuration
        run: docker compose -f docker-compose.yml config

      - name: Validate production compose configuration (Rule #10)
        run: docker compose -f docker-compose.prod.yml config
